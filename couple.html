<head>

    <title>Album Couple — Studio Adjei</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
    <style>
        /* ── ALBUM-SPECIFIC STYLES ─────────────────────────────── */

        .album-hero{
            position: relative;
            z-index: 1;
            padding: 40px 20px 32px;
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .album-back{
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 999px;
            border: 1px solid var(--stroke);
            background: rgba(128,128,140,.12);
            color: var(--text);
            font-size: .88rem;
            font-weight: 500;
            transition: background .2s ease, color .2s ease, transform .2s ease, box-shadow .2s ease;
        }
        .album-back:hover{
            transform: translateX(-3px);
            background: rgba(var(--accent-rgb),.12);
            color: var(--accent);
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .album-meta{ display: flex; flex-direction: column; gap: 4px; }
        .album-category{
            font-size: .75rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 500;
        }
        .album-title{
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(2.4rem, 7vw, 4.5rem);
            font-weight: 300;
            line-height: 1.05;
            letter-spacing: -0.5px;
        }
        .album-title em{ font-style: italic; color: var(--accent); }
        .album-count{
            font-size: .82rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ── LIGHTBOX ──────────────────────────────────────────── */
        .album-grid{
            max-width: 1280px;
            margin: 0 auto 60px;
            padding: 0 20px;
            columns: 3;
            column-gap: 14px;
            position: relative; z-index: 1;
        }
        @media(max-width:900px){ .album-grid{ columns: 2; } }
        @media(max-width:500px){ .album-grid{ columns: 2; column-gap: 8px; padding: 0 12px; } }

        .album-item{
            break-inside: avoid;
            margin-bottom: 14px;
            border-radius: 18px;
            overflow: hidden;
            cursor: zoom-in;
            position: relative;
            background: rgba(128,128,140,.1);
            box-shadow: var(--shadow);
            transition: transform .32s cubic-bezier(.2,.8,.2,1), box-shadow .32s ease;
        }
        @media(max-width:500px){ .album-item{ margin-bottom: 8px; border-radius: 12px; } }
        .album-item:hover{
            transform: translateY(-4px) scale(1.012);
            box-shadow: 0 24px 64px rgba(0,0,0,.28);
        }
        .album-item img{
            width: 100%;
            display: block;
            transition: transform .5s ease;
        }
        .album-item:hover img{ transform: scale(1.04); }

        /* photo number badge */
        .album-item::after{
            content: attr(data-index);
            position: absolute;
            bottom: 10px; right: 12px;
            font-size: .72rem;
            color: rgba(255,255,255,.7);
            background: rgba(0,0,0,.35);
            padding: 3px 9px;
            border-radius: 999px;
            backdrop-filter: blur(10px);
            letter-spacing: .5px;
        }

        /* ── LIGHTBOX OVERLAY ──────────────────────────────────── */
        .lightbox{
            position: fixed; inset: 0;
            z-index: 9000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0; pointer-events: none;
            transition: opacity .3s ease;
        }
        .lightbox.open{ opacity: 1; pointer-events: auto; }

        .lightbox-img{
            max-width: min(90vw, 1000px);
            max-height: 88vh;
            border-radius: 20px;
            box-shadow: 0 40px 120px rgba(0,0,0,.7);
            object-fit: contain;
            transform: scale(.94);
            transition: transform .35s cubic-bezier(.2,.8,.2,1);
            user-select: none;
        }
        .lightbox.open .lightbox-img{ transform: scale(1); }

        .lb-btn{
            position: absolute;
            top: 50%; transform: translateY(-50%);
            width: 52px; height: 52px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.18);
            background: rgba(255,255,255,.1);
            backdrop-filter: blur(14px);
            color: #fff;
            display: grid; place-items: center;
            cursor: pointer;
            transition: background .2s ease, transform .2s ease;
            z-index: 1;
        }
        .lb-btn:hover{ background: rgba(var(--accent-rgb),.3); transform: translateY(-50%) scale(1.08); }
        .lb-prev{ left: 20px; }
        .lb-next{ right: 20px; }
        .lb-close{
            position: absolute;
            top: 18px; right: 18px;
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.18);
            background: rgba(255,255,255,.1);
            backdrop-filter: blur(14px);
            color: #fff;
            display: grid; place-items: center;
            cursor: pointer;
            transition: background .2s ease;
        }
        .lb-close:hover{ background: rgba(255,80,80,.35); }
        .lb-counter{
            position: absolute;
            bottom: 22px; left: 50%;
            transform: translateX(-50%);
            font-size: .82rem;
            color: rgba(255,255,255,.6);
            background: rgba(0,0,0,.3);
            padding: 5px 16px;
            border-radius: 999px;
            backdrop-filter: blur(10px);
            letter-spacing: 1px;
        }

        /* ── ALBUM NAV FOOTER ──────────────────────────────────── */
        .album-footer-nav{
            position: relative; z-index:1;
            max-width: 1280px;
            margin: 0 auto 40px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .album-nav-btn{
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 999px;
            border: 1px solid var(--stroke);
            background: rgba(128,128,140,.12);
            color: var(--text-muted);
            font-size: .88rem;
            transition: background .2s ease, color .2s ease, transform .2s ease, box-shadow .2s ease;
        }
        .album-nav-btn:hover{
            background: rgba(var(--accent-rgb),.12);
            color: var(--accent);
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .album-nav-btn.prev:hover{ transform: translateX(-3px); }
        .album-nav-btn.next:hover{ transform: translateX(3px); }

        /* ── WA CTA ────────────────────────────────────────────── */
        .album-cta-strip{
            position: relative; z-index: 1;
            max-width: 1280px;
            margin: 0 auto 48px;
            padding: 0 20px;
        }
        .album-cta-card{
            padding: 28px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        .album-cta-card h3{
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 400;
        }
        .album-cta-card p{
            font-size: .88rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .album-cta-btn{
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-weight: 500;
            font-size: .92rem;
            box-shadow: 0 8px 28px var(--accent-glow);
            transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
            white-space: nowrap;
        }
        .album-cta-btn:hover{
            transform: translateY(-2px);
            box-shadow: 0 14px 40px var(--accent-glow);
            opacity: .92;
        }

    <script>
    /* ── THEME SYNC (lit les préférences du site principal) ─────── */
    (function syncTheme() {
        const body      = document.body;
        const savedMode = localStorage.getItem('sa-theme');
        const savedColor= localStorage.getItem('sa-color');

        // Dark / light
        const isDark = savedMode !== null ? savedMode === 'dark' : true;
        body.classList.toggle('dark-mode', isDark);

        // Couleur accent
        if (savedColor) {
            document.documentElement.setAttribute('data-color', savedColor);
        }
    })();

    /* ── LIGHTBOX ───────────────────────────────────────────────── */
    document.addEventListener('DOMContentLoaded', () => {
        const items    = Array.from(document.querySelectorAll('.album-item'));
        const lb       = document.getElementById('lightbox');
        const lbImg    = document.getElementById('lb-img');
        const lbCounter= document.getElementById('lb-counter');
        const lbClose  = document.getElementById('lb-close');
        const lbPrev   = document.getElementById('lb-prev');
        const lbNext   = document.getElementById('lb-next');
        let current    = 0;

        // update count display
        const countEl = document.getElementById('photo-count');
        if (countEl) countEl.textContent = items.length + ' photo' + (items.length > 1 ? 's' : '');

        function open(i) {
            current = i;
            lbImg.src = items[i].dataset.src;
            lbCounter.textContent = (i + 1) + ' / ' + items.length;
            lb.classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function close() {
            lb.classList.remove('open');
            document.body.style.overflow = '';
            setTimeout(() => { lbImg.src = ''; }, 300);
        }
        function prev() { open((current - 1 + items.length) % items.length); }
        function next() { open((current + 1) % items.length); }

        items.forEach((item, i) => item.addEventListener('click', () => open(i)));
        lbClose.addEventListener('click', close);
        lbPrev.addEventListener('click', prev);
        lbNext.addEventListener('click', next);
        lb.addEventListener('click', e => { if (e.target === lb) close(); });

        // Keyboard
        document.addEventListener('keydown', e => {
            if (!lb.classList.contains('open')) return;
            if (e.key === 'Escape')      close();
            if (e.key === 'ArrowLeft')   prev();
            if (e.key === 'ArrowRight')  next();
        });

        // Swipe
        let touchStartX = 0;
        lb.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
        lb.addEventListener('touchend',   e => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
        }, { passive: true });
    });
    </script>
